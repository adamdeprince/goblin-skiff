syntax = "proto2";

option optimize_for = LITE_RUNTIME;

package HostBuffers;

import "stream.proto";
import "clipboard.proto";
import "kitty.proto";

message HostMessage {
  repeated Instruction instruction = 1;
}

message Instruction {
  extensions 2 to max;
}

message HostBytes {
  optional bytes hoststring = 4;
}

message ResizeMessage {
  optional int32 width = 5;
  optional int32 height = 6;
}

message EchoAck {
  optional uint64 echo_ack_num = 8;
}

extend Instruction {
  optional HostBytes hostbytes = 2;
  optional ResizeMessage resize = 3;
  optional EchoAck echoack = 7;
  optional StreamBuffers.StreamEvent stream = 9;
  optional ClipboardBuffers.ClipboardEvent clipboard = 10;
  optional KittyBuffers.StateDelta kitty = 11;
  // Ordered bytes from tmux -CC, including its DCS entry and exit markers.
  optional bytes tmux_output = 12;
}
