syntax = "proto2";

option optimize_for = LITE_RUNTIME;

package KittyBuffers;

message Image {
  required uint32 id = 1;
  optional uint32 number = 2;
  required uint32 width = 3;
  required uint32 height = 4;
  // Exactly one of webp or djvu is present. Older peers receive only WebP.
  optional bytes webp = 5;
  enum Origin { KITTY = 0; SIXEL = 1; }
  optional Origin origin = 6 [default = KITTY];
  // palette-djvu-v1: a single DjVu page of stacked index bitplanes,
  // least significant bit first, black = 1. Plane count is max(1, ceil(log2
  // (palette.size / 4))). Page dimensions are width x (height * plane count).
  // Lossless unless the sender explicitly enables lossy two-color encoding.
  optional bytes djvu = 7;
  optional bytes palette = 8; // 1..16 RGBA entries; absent for WebP
}

message Placement {
  required uint32 image_id = 1;
  optional uint32 placement_id = 2;
  required sint32 row = 3;
  required sint32 col = 4;
  optional uint32 columns = 5;
  optional uint32 rows = 6;
  optional uint32 src_x = 7;
  optional uint32 src_y = 8;
  optional uint32 src_w = 9;
  optional uint32 src_h = 10;
  optional uint32 cell_x = 11;
  optional uint32 cell_y = 12;
  optional sint32 z = 13;
  optional bool cursor_hold = 14;
  optional bool unicode_placeholder = 15;
  optional uint32 parent_image = 16;
  optional uint32 parent_placement = 17;
  optional sint32 horizontal_offset = 18;
  optional sint32 vertical_offset = 19;
}

message StateDelta {
  repeated uint32 delete_image_id = 1 [packed = true];
  repeated Image image = 2;
  optional bool replace_placements = 3 [default = false];
  repeated Placement placement = 4;
}
