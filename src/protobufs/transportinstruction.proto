syntax = "proto2";

option optimize_for = LITE_RUNTIME;

package TransportBuffers;

message Instruction {
  optional uint32 protocol_version = 1;

  optional uint64 old_num = 2;
  optional uint64 new_num = 3;
  optional uint64 ack_num = 4;
  optional uint64 throwaway_num = 5;

  optional bytes diff = 6;

  optional bytes chaff = 7;

  optional bool zstd_supported = 8;
  optional bytes zstd_dict_id = 9;

  // Goblin baseline 1. Advertise together until the first state is ACKed.
  // Release/build identify the peer; only protocol changes break compatibility.
  optional string goblin_release = 10;
  optional string goblin_build = 11;
  optional uint32 goblin_protocol = 12;
  // Extended fragment indices remove the legacy 32768-packet state ceiling.
  optional bool large_fragments_supported = 13;
  // The reports of a hand may come as binary records in a user diff.
  optional bool motion_records_supported = 14;
  // An instruction that compression would only lengthen may come as it is,
  // behind a zero byte.
  optional bool raw_frames_supported = 15;
  // Notifications, and a terminal's answers to them, may come as Notice
  // datagrams of their own, ahead of the state (src/network/noticechannel.h).
  optional bool notices_supported = 16;
}
